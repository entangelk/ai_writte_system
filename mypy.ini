# 타입체커 설정 — docs/plans/script-rot-guard-decisions.md 결정 1=B.
#
# 이 저장소가 mypy 를 들이는 이유는 "타입을 다 붙이자" 가 아니라 단 하나다:
# 테스트가 한 번도 실행하지 않는 코드의 시그니처 부패를 잡는 것. 실제로
# scripts/calibrate_character_identity_threshold.py:20 이 그 이유로 한 달 넘게
# TypeError 로 깨진 채 green 이었다.
#
# 그래서 에러 코드를 좁힌다. 기본 설정으로 열면 services+scripts 에 88건이
# 나오고(2026-08-20 실측), 그 88건을 억제 목록으로 덮으면 목록 자체가 부채가
# 된다. 좁힌 집합에서는 5건이었고 전부 실제로 처리했다 — 억제 목록이 없다.
#
# ★ misc 를 disable 목록에 넣지 말 것. 넣는 순간 표적 결함(call-arg)이 출력에서
#   사라진다. 코드 8종을 하나씩 끄며 확인했고(캐시 아님), tests/test_typecheck.py
#   의 test_disabling_misc_would_hide_the_target_defect 가 이것을 잠근다.
#
# 넓히는 트리거는 브리프 §후속 고려에 있다. 넓히기는 additive 라 이 설정을
# 되돌리지 않는다.

[mypy]
# services.application.app.* 를 스크립트에서 import 하므로 저장소 루트가 경로다.
mypy_path = .

# 서드파티 스텁을 요구하지 않는다. 이 가드는 우리 코드끼리의 시그니처만 본다.
ignore_missing_imports = True

# tests/ 는 범위 밖이다(같은 설정에서 219건 — 대부분 실물 드라이버를 흉내 내는
# 테스트 스텁이다). 브리프 §유예 항목.
files = services, scripts

# 좁힌 집합 = call-arg + misc. 아래는 그 밖의 것을 끈 목록이며, 각 줄은
# "지금 안 본다" 이지 "괜찮다" 가 아니다.
#
# var-annotated 는 이 목록에 늦게 들어왔다. 브리프 확정 때 쓴 측정이 런타임
# 의존성이 없는 venv 에서 나온 것이라 pymongo 제네릭이 Any 로 뭉개져 안 보였다
# (같은 이유로 전체 에러 수도 88 이 아니라 111 이 맞다 — 2026-08-20 호스트 실측).
# 내용은 `client = MongoClient(uri)` 에 제네릭 인자를 안 적었다는 지적 5건이고,
# 이 가드가 겨누는 시그니처 부패가 아니다.
#
# ★ 여기서 배울 것: 같은 설정이 머신마다 다른 수를 낸다 — 서드파티가 설치돼
#   있어야 그 제네릭이 풀리기 때문이다. 그런데 call-arg 는 우리 코드끼리의
#   호출이라 양쪽 환경에서 똑같이 1건이었다. 좁힌 집합이 이 가드를 재현
#   가능하게 만드는 이유가 그것이다.
disable_error_code =
    arg-type,
    operator,
    attr-defined,
    union-attr,
    return-value,
    assignment,
    type-var,
    var-annotated
