# D2=B: the frontend is its own service, but it keeps the single origin the
# owner's decision would otherwise lose — nginx serves the SPA and reverse-proxies
# /api to the Application. The browser therefore never makes a cross-origin call,
# so the unauthenticated API needs no CORS opening (the D2=C downside).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Strip the /api prefix: the Application owns paths at the root
        # (/projects, /health, …). The trailing slash on proxy_pass does it.
        proxy_pass http://application:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The bounded Writing loop is a synchronous request with a 60s deployed
        # wall-clock budget (SoT v1.6.89). Keep the proxy timeout above it so
        # nginx does not cut the request before the loop's own budget does.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA client-side routing: unknown paths serve index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
