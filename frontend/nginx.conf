# D2=B: the frontend is its own service, but it keeps the single origin the
# owner's decision would otherwise lose — nginx serves the SPA and reverse-proxies
# /api to the Application. The browser therefore never makes a cross-origin call,
# so the unauthenticated API needs no CORS opening (the D2=C downside).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slice 2 (A1=ⓑ, 2026-08-09): the administrator surface lives in its own
    # container, which publishes no host port — this location is the only way
    # to reach it. It must stay **above/more specific than** `/api/`: nginx
    # picks the longest matching prefix location, so `/api/admin/...` lands here
    # and everything else falls through to the product application below.
    #
    # The browser is unaffected: same origin, same session cookie, same
    # `/api/admin/...` URLs the console already calls. Sessions live in Mongo,
    # so both upstreams read the same cookie with no shared secret.
    location /api/admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream admin;

        # Strip only `/api`, exactly like the block below — the admin app serves
        # `/admin/...`, so the `/admin` segment must survive the rewrite.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$admin_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Purge walks the whole project graph across ~18 collections; keep the
        # same headroom the product location gives the bounded Writing loop.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        # Resolve the upstream per request, not once at startup.
        #
        # With a literal `proxy_pass http://application:8000/` nginx resolves the
        # name when it loads the config and then caches that address for the
        # process lifetime. Two failures came from that:
        #   1. Recreating the Application container (image swap, env change) gave
        #      it a new IP, and nginx kept proxying to the old one — every
        #      /api call 502'd until the frontend was restarted too.
        #   2. Worse, if `application` was not resolvable at startup nginx
        #      refused to boot at all ("host not found in upstream"), so the
        #      whole SPA was down whenever the API happened to be down.
        # Naming the upstream in a variable defers resolution to request time via
        # Docker's embedded DNS, which fixes both: nginx always boots, and it
        # follows the Application to its current address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $application_upstream application;

        # A proxy_pass with a variable does not perform the location-prefix
        # replacement that the literal form's trailing slash gave us, so strip
        # /api explicitly. Query strings are carried over untouched.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$application_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The bounded Writing loop is a synchronous request with a 60s deployed
        # wall-clock budget (SoT v1.6.89). Keep the proxy timeout above it so
        # nginx does not cut the request before the loop's own budget does.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA client-side routing: unknown paths serve index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
