# Slice 1 runtime: Application API + MongoDB (single-node replica set).
# The replica set is required because the approved persistence contract uses
# MongoDB transactions by default (SoT v1.3 §112).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27520}:27017"
    volumes:
      - mongo_data:/data/db
    # Docker's default soft nofile here is 1024, and mongod warns at startup that
    # the recommended minimum is 64000. When WiredTiger reaches the ceiling it
    # does not degrade — it panics (WT_PANIC: __posix_directory_sync ... Too many
    # open files), fasserts and dies mid-write. Observed on `test-mongo` under the
    # backend suite (2026-07-23); the deployed node shares the same condition and
    # only survives because it holds one long-lived database. Indexing and
    # analysis growth close that gap, so the limit is raised here too rather than
    # waiting for the crash. Same value as docker-compose.test.yml.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      # Idempotently initiate the single-node replica set, then report healthy
      # once it is up. The member host must match the in-network name the
      # application uses (mongo:27017) so replica-set discovery resolves it.
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  application:
    build:
      context: .
      dockerfile: services/application/Dockerfile
    environment:
      CORE_SOT_MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      CORE_SOT_MONGO_DB: "ai_writing_system"
      CORE_SOT_MONGO_TRANSACTIONS: "true"
      LLM_GATEWAY_BASE_URL: "http://gateway:8001"
      LLM_GATEWAY_MODEL: "${LLAMA_DEFAULT_MODEL:-gemma-local}"
      LLM_GATEWAY_TIMEOUT_SECONDS: "${LLAMA_TIMEOUT_SECONDS:-120}"
      # Phase 5.9 bounded Writing loop structural caps. These include the
      # initial requested revision/Gate and can be tuned after observing stages.
      WRITING_LOOP_MAX_REVISION_ROUNDS: "${WRITING_LOOP_MAX_REVISION_ROUNDS:-2}"
      WRITING_LOOP_MAX_RETRIEVAL_ROUNDS: "${WRITING_LOOP_MAX_RETRIEVAL_ROUNDS:-1}"
      WRITING_LOOP_MAX_GATE_EVALUATIONS: "${WRITING_LOOP_MAX_GATE_EVALUATIONS:-3}"
      # Phase 5.10 ("B2") aggregate token/wall-clock budget. Production defaults
      # from the B2b live per-stage measurement (2026-07-15, SoT v1.6.89): raw
      # worst-case ceiling was 4991 tokens / 28.8s steady-state (docs/benchmarks/
      # 2026-07-15/), and the owner's B4 margin is ~2x → 10000 tokens / 60000 ms.
      # Override per machine; the code default (env unset) stays unbounded so the
      # structural caps alone still bound the loop off-deployment.
      WRITING_LOOP_MAX_TOTAL_TOKENS: "${WRITING_LOOP_MAX_TOTAL_TOKENS:-10000}"
      WRITING_LOOP_MAX_WALL_CLOCK_MS: "${WRITING_LOOP_MAX_WALL_CLOCK_MS:-60000}"
      # Self-report OUTPUT budget. Must stay above the longest prose preset
      # (WRITING_OUTPUT_LENGTH_LONG) — the report is a JSON summary OF the prose,
      # so a cap at prose length truncates the JSON and fails as `invalid_report`.
      # Ceiling is the llama per-slot context (LLAMA_CTX_SIZE 8192) shared with the
      # prompt; 6144 keeps 2048 tokens of prompt headroom.
      WRITING_REPORT_MAX_TOKENS: "${WRITING_REPORT_MAX_TOKENS:-6144}"
      # Unaccepted-candidate recovery store: how many unaccepted drafts are kept
      # per 원고 before the oldest is dropped. Useful depth differs per writer, so
      # this stays tunable; the value is provisional pending SoT ratification
      # (docs/plans/unaccepted-candidate-persistence-decisions.md). Must be >= 1 —
      # the app refuses to start otherwise rather than silently discard drafts.
      WRITING_SCRATCH_MAX_PER_DRAFT: "${WRITING_SCRATCH_MAX_PER_DRAFT:-20}"
      # ProjectBrief few-shot examples share the Writing context budget. Keep a
      # conservative default while allowing dogfood tuning without code changes.
      # Both values must be >= 1 or the application refuses to start.
      PROJECT_BRIEF_STYLE_EXAMPLES_MAX_ITEMS: "${PROJECT_BRIEF_STYLE_EXAMPLES_MAX_ITEMS:-3}"
      PROJECT_BRIEF_STYLE_EXAMPLE_MAX_CHARS: "${PROJECT_BRIEF_STYLE_EXAMPLE_MAX_CHARS:-1000}"
      # Real vector backend (B.4): the embedding service and Chroma. When these
      # are set the shared vector index is the persistent Chroma backend with
      # real 1024-dim embeddings; without them the app falls back to the fake.
      EMBEDDING_SERVICE_URL: "http://embedding:8002"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      # §8 lexical leg (v1.6.52): with Elasticsearch configured alongside the
      # vector backend, the canonical memory retriever is hybrid (vector+lexical
      # RRF). Without it the app falls back to vector-only / Mongo-direct.
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    ports:
      - "${APPLICATION_PORT:-8520}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_healthy
      embedding:
        condition: service_healthy
      chroma:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; probe /health with stdlib urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: services/llm_gateway/Dockerfile
    environment:
      # Compose owns only the client gateway. The llama.cpp server is operated
      # outside this stack and can be changed per machine via LLAMA_BASE_URL.
      LLAMA_BASE_URL: "${LLAMA_BASE_URL:-http://host.docker.internal:9080}"
      LLAMA_DEFAULT_MODEL: "${LLAMA_DEFAULT_MODEL:-gemma-local}"
      LLAMA_DEFAULT_THINKING: "${LLAMA_DEFAULT_THINKING:-false}"
      LLAMA_TIMEOUT_SECONDS: "${LLAMA_TIMEOUT_SECONDS:-120}"
      LLAMA_TRUST_ENV: "${LLAMA_TRUST_ENV:-false}"
    ports:
      - "${GATEWAY_PORT:-8521}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Liveness is intentionally local-only; /health/ready checks the external
      # llama.cpp endpoint when an operator wants upstream readiness.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/live', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  embedding:
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    environment:
      # Real local embedding model for the vector backend (dragonkue/BGE-m3-ko,
      # 1024-dim). Kept as its own container, separate from the llama gateway,
      # so the vector backend stays independent of the LLM gate.
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-dragonkue/BGE-m3-ko}"
      EMBEDDING_NORMALIZE: "${EMBEDDING_NORMALIZE:-true}"
      # Let the model download reach HuggingFace at first startup.
      HF_HOME: "/root/.cache/huggingface"
    ports:
      - "${EMBEDDING_PORT:-8522}:8002"
    volumes:
      # Cache the model across restarts so it is downloaded only once.
      - embedding_cache:/root/.cache/huggingface
    healthcheck:
      # The model loads at startup (lifespan blocks serving until ready), so a
      # successful probe means the model is loaded. The window is generous
      # because the first run downloads the model.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/ready', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  chroma:
    # Persistent vector backend for the Phase 4 real vector index. The tag and
    # heartbeat path are validated at live bring-up (B.5); the healthcheck below
    # is a port-open liveness probe to stay independent of the API version path.
    image: "chromadb/chroma:${CHROMA_VERSION:-0.5.23}"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_PORT:-8523}:8000"
    volumes:
      # chromadb/chroma:0.5.23 stores persistent data under /chroma/chroma when
      # IS_PERSISTENT=TRUE. Mount that path so container recreation does not
      # lose the vector index.
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('localhost',8000)))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  elasticsearch:
    # §8 lexical/hybrid backend: canonical memory nori (Korean) index. Built from
    # the official image + analysis-nori (services/elasticsearch/Dockerfile). The
    # code connects plaintext without auth, so security is disabled — this is the
    # local single-user MVP posture (matches the test container); enabling auth is
    # a separate slice that needs client credential wiring.
    build:
      context: .
      dockerfile: services/elasticsearch/Dockerfile
      args:
        ELASTICSEARCH_VERSION: "${ELASTICSEARCH_VERSION:-8.13.4}"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_PORT:-9520}:9200"
    volumes:
      # Persist the lexical index across container recreation. Like Chroma it is a
      # derived index rebuildable from Mongo, but keeping it avoids a reindex on
      # every restart.
      - es_data:/usr/share/elasticsearch/data
    # Same fd ceiling as `mongo` above, found by the same sweep: the image gets
    # Docker's default soft nofile 1024 while Elasticsearch's own file-descriptor
    # requirement is 65535. Normally its bootstrap check refuses to start below
    # that, but `discovery.type=single-node` runs in development mode where the
    # check is downgraded to a startup warning — so the node comes up and can
    # exhaust descriptors later under segment/index churn instead of failing
    # loudly at boot. memlock is left alone: bootstrap.memory_lock is not enabled.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # The ES image ships curl (no python); probe cluster health. A 200 (green or
      # yellow — single-node leaves replicas unassigned = yellow) means responsive.
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:9200/_cluster/health || exit 1"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  worker:
    # b-6 (G0=A): the index-sync drain as an always-on compose service instead
    # of manual/out-of-band execution. Shares the application image (same Python
    # runtime + deps + indexing code); the command runs the draining loop. With
    # CHROMA_HOST + ELASTICSEARCH_URL set it drains the composite (vector+lexical)
    # sinks; the atomic outbox claim (find_one_and_update + lease) makes this safe
    # to run as a single replica (G2=A). G1=A: no health port — restart + the
    # per-pass stdout JSON is the observability channel, and each sink call is
    # bounded by its request_timeout so the loop cannot wedge indefinitely.
    build:
      context: .
      dockerfile: services/application/Dockerfile
    command: ["python", "scripts/index_sync_worker.py", "--loop"]
    environment:
      CORE_SOT_MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      CORE_SOT_MONGO_DB: "ai_writing_system"
      EMBEDDING_SERVICE_URL: "http://embedding:8002"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      INDEX_SYNC_INTERVAL: "${INDEX_SYNC_INTERVAL:-30}"
    depends_on:
      mongo:
        condition: service_healthy
      embedding:
        condition: service_healthy
      chroma:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    # A composite drain (MEMORY/CANDIDATE) fans one entry out to embedding ->
    # Chroma -> ES sequentially, each call bounded by its request_timeout; under
    # a degraded backend those timeouts can add up. stop_grace_period must exceed
    # that per-entry worst case so SIGTERM can finish the in-flight entry
    # (stop_check exits at the next claim boundary, leaving no RUNNING entry)
    # instead of being SIGKILL'd mid-drain — a SIGKILL would strand the entry as
    # RUNNING until the 600s lease stale-reclaims it. 120s bounds ~3 sequential
    # 30s timeouts with headroom. NOTE: keep INDEX_SYNC_INTERVAL <= this.
    stop_grace_period: 120s

  generation_worker:
    # async-pad 증분 2b (D3=B): the background generation worker. Separate from
    # the index-sync `worker` above — the index outbox is idempotent single-shot
    # CDC, generation jobs are long-lived non-idempotent user requests (brief
    # verification H3), so a distinct service rather than a second outbox sink.
    # Shares the application image (same runtime + generate pipeline). Unlike the
    # index worker it calls the LLM gateway, so it needs the same gateway +
    # context env as `application`; the atomic claim (find_one_and_update + lease)
    # makes a single replica safe. Observability = restart + per-pass stdout JSON.
    build:
      context: .
      dockerfile: services/application/Dockerfile
    command: ["python", "scripts/generation_job_worker.py", "--loop"]
    environment:
      CORE_SOT_MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      CORE_SOT_MONGO_DB: "ai_writing_system"
      CORE_SOT_MONGO_TRANSACTIONS: "true"
      LLM_GATEWAY_BASE_URL: "http://gateway:8001"
      LLM_GATEWAY_MODEL: "${LLAMA_DEFAULT_MODEL:-gemma-local}"
      LLM_GATEWAY_TIMEOUT_SECONDS: "${LLAMA_TIMEOUT_SECONDS:-120}"
      # Same per-draft scratch cap as application (the pad shares the store).
      WRITING_SCRATCH_MAX_PER_DRAFT: "${WRITING_SCRATCH_MAX_PER_DRAFT:-20}"
      # Output-length presets the endpoint enqueues (server owns the mapping).
      WRITING_OUTPUT_LENGTH_MEDIUM: "${WRITING_OUTPUT_LENGTH_MEDIUM:-2048}"
      WRITING_OUTPUT_LENGTH_LONG: "${WRITING_OUTPUT_LENGTH_LONG:-4096}"
      # Same self-report budget as application — the worker runs the same
      # generate→report pipeline, and a 1024 cap truncated the report JSON on
      # every long-prose job (2026-07-22 live e2e).
      WRITING_REPORT_MAX_TOKENS: "${WRITING_REPORT_MAX_TOKENS:-6144}"
      # Claim lease: a crashed worker's in-flight job is reclaimable past this.
      # Must exceed the longest generate (long≈91s bounded by the gateway timeout).
      WRITING_GENERATION_CLAIM_TIMEOUT_SECONDS: "${WRITING_GENERATION_CLAIM_TIMEOUT_SECONDS:-600}"
      GENERATION_WORKER_INTERVAL: "${GENERATION_WORKER_INTERVAL:-5}"
      # Context search needs the same real backends as application.
      EMBEDDING_SERVICE_URL: "http://embedding:8002"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_healthy
      embedding:
        condition: service_healthy
      chroma:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM exits at the next job boundary (the in-flight generate finishes),
    # so the grace period must exceed the longest generate — bounded by
    # LLM_GATEWAY_TIMEOUT_SECONDS (120s) plus headroom. A SIGKILL mid-job only
    # strands the job RUNNING until the claim lease stale-reclaims it.
    stop_grace_period: 180s

  frontend:
    # Product shell SPA (decisions D1=A React+TS+Vite / D2=B separate service
    # locked in SoT v1.6.93; implemented as this service in v1.6.94).
    # nginx serves the built bundle and reverse-proxies /api to the application,
    # so the browser stays on one origin and the unauthenticated API needs no
    # CORS opening. The build stage compiles the bundle inside the image, so no
    # host node_modules/dist is required (see services/frontend/Dockerfile).
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5520}:80"
    depends_on:
      application:
        condition: service_healthy
    healthcheck:
      # The alpine nginx image ships wget (busybox), not curl. Probe 127.0.0.1
      # (not localhost): /etc/hosts maps `localhost` to `::1` as well, busybox
      # wget prefers the IPv6 record, and nginx here is `listen 80;` (IPv4 only),
      # so `http://localhost/` gets "Connection refused" and the container reports
      # unhealthy while actually serving fine. Forcing IPv4 matches nginx's listen.
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo_data:
  embedding_cache:
  chroma_data:
  es_data:
